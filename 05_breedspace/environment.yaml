name: BreedSpace
language: R
tested_environment:
  R: '4.3.1'
  packages:
    Matrix: '1.6.4'
    Rcpp: '1.0.11'
    highs: '1.9.0.1'
    digest: '0.6.33'
    yaml: '2.3.8'
  optional_packages:
    qs: '0.27.3'
  build_tools: C++11 compiler and GNU make for MDS and similarity
runtime:
  command_syntax: '--name=value'
  table_format: TSV or TSV.GZ
  object_format: RDS
  scoring_definition: pure_additive_parent_ratio_v1
  genotype_storage: sparse dosage differences, windows by individuals
